<!DOCTYPE html>
<html lang="en" data-bs-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Download Financial Calculator</title>
    
    <!-- Bootstrap CSS from Replit theme -->
    <link rel="stylesheet" href="https://cdn.replit.com/agent/bootstrap-agent-dark-theme.min.css">
    
    <!-- Font Awesome for icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- Custom CSS -->
    <link rel="stylesheet" href="{{ url_for('static', filename='css/custom.css') }}">
</head>
<body>
    <div class="container py-5">
        <div class="row justify-content-center">
            <div class="col-md-8 text-center">
                <h1 class="display-4 mb-4">Financial Calculator</h1>
                <p class="lead mb-5">Download the complete source code for the Financial Calculator application</p>
                
                <div class="card shadow-lg">
                    <div class="card-body p-5">
                        <i class="fas fa-file-archive fa-5x text-primary mb-4"></i>
                        <h2 class="mb-4">Download Package</h2>
                        <p class="mb-4">This package includes all HTML, CSS, JavaScript, and Python files needed to run the Financial Calculator application.</p>
                        <a href="{{ url_for('download_file') }}" class="btn btn-primary btn-lg">
                            <i class="fas fa-download me-2"></i>Download ZIP File
                        </a>
                    </div>
                </div>
                
                <div class="mt-5">
                    <a href="{{ url_for('index') }}" class="btn btn-outline-secondary">
                        <i class="fas fa-arrow-left me-2"></i>Return to Calculator
                    </a>
                </div>
            </div>
        </div>
    </div>
    
    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
